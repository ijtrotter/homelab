apiVersion: 1

# Drop any previously stored entry (e.g. one auto-created without our pinned uid)
# so the datasource below always provisions cleanly. Recreated on every startup.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
