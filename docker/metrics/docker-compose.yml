services:
  graphite_exporter:
    image: ghcr.io/supporterino/truenas-graphite-to-prometheus:latest
    container_name: graphite_exporter
    restart: unless-stopped
    ports:
      - "9109:9109" # TrueNAS pushes Graphite-formatted metrics here
      - "9108:9108" # Prometheus scrapes translated metrics here

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    depends_on:
      - graphite_exporter
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    env_file:
      - .env
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"

volumes:
  prometheus_data:
  grafana_data:
